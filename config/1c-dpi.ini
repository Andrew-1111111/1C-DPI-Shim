[shim]
; Target scale for 1C only, as a percent of 96 DPI (50–400; may exceed 255).
; Windows 175% = 168 DPI.  200=192, 225=216, 250=240, 300=288, 400=384.
dpi=225
enabled=1

; Diagnostic log in the application folder. 1 = on, 0 = off.
log=1
log_verbose=1
log_path=1c-dpi-shim.log

; Leave these at 0 unless 1C chrome (scrollbars/menus taken from
; GetSystemMetrics) stays too small after DPI spoofing. Enabling them can
; double-scale if 1C already applies getContextDPI() to those metrics.
scale_system_metrics=0
scale_nonclient_metrics=0

; Scale DEFAULT_GUI_FONT / SYSTEM_FONT. Configurator uses stock fonts
; more than Taxi; keep 1 unless fonts become too large.
scale_stock_fonts=1

; Keep the thread system-aware. Per-monitor switches make Windows report
; the real 168 DPI for the Configurator window while the shim spoofs 216.
block_per_monitor=1

[launcher]
; Path to the 1C executable launched by 1C-DPI-Shim.exe.
; Change these if 1C is installed in a non-default folder.
exe=C:\Program Files (x86)\1cv8\common\1cestart.exe
start_exe=C:\Program Files (x86)\1cv8\common\1cestart.exe
platform_exe=C:\Program Files (x86)\1cv8\8.3.27.2342\bin\1cv8.exe
